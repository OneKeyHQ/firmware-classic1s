syntax = "proto2";
package hw.trezor.messages.kaspa;

// Sugar for easier handling in Java
option java_package = "com.satoshilabs.trezor.lib.protobuf";
option java_outer_classname = "TrezorMessageKaspa";

/**
 * Request: Ask device for address corresponding to address_n path
 * @start
 * @next Address
 * @next Failure
 */
message KaspaGetAddress {
    repeated uint32 address_n = 1;                                      // BIP-32 path to derive the key from master node
    optional bool show_display = 2;                                     // optionally show on display before sending the result
    optional string prefix = 3 [default="kaspa"];                       // prefix for address
    optional string scheme = 4 [default="schnorr"];                     // address scheme
    optional bool use_tweak = 5 [default=true];                         // use bip340 tweak
}

/**
 * Response: Contains address derived from device private seed
 * @end
 */
message KaspaAddress {
    required string address = 1;    // Coin address in cashaddr encoding
}

/**
 * Request: Ask device to sign transaction
 * @start
 * @next KaspaSignedTx
 * @next KaspaTxInputRequest
 * @next KaspaTxRequest
 * @next Failure
 */
message KaspaSignTx {
    repeated uint32 address_n = 1;                                      // BIP-32 path to derive the key from master node
    optional bytes raw_message = 2;                                     // legacy blind-signing payload; used only when output_count is absent
    optional string scheme = 3 [default="schnorr"];                     // signature scheme
    optional string prefix = 4 [default="kaspa"];                       // prefix for address
    optional uint32 input_count = 5 [default=1];                        // number of inputs in the transaction
    optional bool use_tweak = 6 [default=true];                         // use bip340 tweak
    optional uint32 output_count = 7;                                   // number of outputs; presence selects streaming signing
    optional uint32 version = 8 [default=0];                            // transaction version
    optional uint64 lock_time = 9 [default=0];                          // transaction lock time
    optional bytes subnetwork_id = 10;                                  // transaction subnetwork id
    optional uint64 gas = 11 [default=0];                               // transaction gas
    optional uint32 payload_length = 12 [default=0];                    // transaction payload length
}

/**
 * Request: Ask client for corresponding input
 * @next KaspaTxInputAck
 * @next Failure
 */
message KaspaTxInputRequest {
    required uint32 request_index = 1;                                            // index of the input to sign
    optional bytes signature = 2;                                                // signature of the pervious input
}

/**
 * Response: Contains input to be signed
 * @next KaspaSignedTx
 * @next Failure
 */
message KaspaTxInputAck {
    repeated uint32 address_n = 1;                                               // BIP-32 path to derive the key from master node
    required bytes raw_message = 2;                                              // the bip143-like pre-hashed message to be signed
}

message KaspaOutpoint {
    required bytes tx_id = 1;
    required uint32 index = 2;
}

enum KaspaInputScriptType {
    KASPA_SPEND_P2PK_SCHNORR = 0;
    KASPA_SPEND_P2PK_ECDSA = 1;
    // KASPA_SPEND_P2SH = 2;
    // KASPA_SPEND_EXTERNAL = 3;
}

enum KaspaOutputScriptType {
    KASPA_PAYTOADDRESS = 0;
    KASPA_PAYTOCHANGE = 1;
    // KASPA_PAYTOP2SH = 2;
    // KASPA_PAYTOOPRETURN = 3;
}

enum KaspaRequestType {
    KASPA_TX_INPUT = 0;                       // request a current or previous transaction input
    KASPA_TX_OUTPUT = 1;                      // request a current or previous transaction output
    KASPA_TX_PAYLOAD = 2;                     // request a current or previous transaction payload chunk
    KASPA_TX_FINISHED = 3;
    KASPA_TX_PREV_META = 4;                   // request metadata of a previous transaction
}

message KaspaTxRequestSignature {
    required uint32 signature_index = 1;
    required bytes signature = 2;
}

/**
 * Response: Requests the next item required by streaming transaction signing
 * @next KaspaTxAckInput
 * @next KaspaTxAckOutput
 * @next KaspaTxAckPayloadChunk
 * @next KaspaTxAckPrevMeta
 * @next KaspaTxAckPrevInput
 * @next KaspaTxAckPrevOutput
 *
 * prev_tx_id is present on every previous-transaction request. For INPUT and
 * OUTPUT requests, its presence selects KaspaTxAckPrevInput and
 * KaspaTxAckPrevOutput respectively. Payload requests always use
 * KaspaTxAckPayloadChunk.
 */
message KaspaTxRequest {
    required KaspaRequestType request_type = 1;
    optional uint32 request_index = 2;         // current input/output index, or previous transaction input/output index
    optional KaspaTxRequestSignature signature = 3;
    optional uint32 request_payload_length = 4; // requested byte count for payload chunks
    optional bytes prev_tx_id = 5;             // previous transaction being requested
}

/**
 * Response: Contains an input of the transaction being signed
 * @next KaspaTxRequest
 * @next Failure
 */
message KaspaTxAckInput {
    repeated uint32 address_n = 1;                                      // BIP-32 path to derive the key from master node
    required KaspaOutpoint previous_outpoint = 2;
    required uint64 amount = 3;
    required uint64 sequence = 4;
    required uint32 sig_op_count = 5;
    optional KaspaInputScriptType script_type = 6 [default=KASPA_SPEND_P2PK_SCHNORR];
    // optional bytes script_public_key = 7;
    // optional string address = 8;
    optional bool use_tweak = 9 [default=true];
}

/**
 * Response: Contains an output of the transaction being signed
 * @next KaspaTxRequest
 * @next Failure
 */
message KaspaTxAckOutput {
    optional KaspaOutputScriptType script_type = 1 [default=KASPA_PAYTOADDRESS];
    required uint64 amount = 2;
    repeated uint32 address_n = 3;                                      // BIP-32 path to derive the key from master node
    optional string address = 4;
    // optional bytes script_public_key = 5;
    // optional bytes op_return_data = 6;
    optional string scheme = 7 [default="schnorr"];
    optional bool use_tweak = 8 [default=true];
}

/**
 * Response: Contains a requested current or previous transaction payload chunk
 * @next KaspaTxRequest
 * @next Failure
 */
message KaspaTxAckPayloadChunk {
    required bytes payload_chunk = 1;
}

/**
 * Response: Contains metadata of a previous transaction.
 * @next KaspaTxRequest
 * @next Failure
 */
message KaspaTxAckPrevMeta {
    required uint32 version = 1;
    required uint32 input_count = 2;
    required uint32 output_count = 3;
    required uint64 lock_time = 4;
    required bytes subnetwork_id = 5;
    required uint64 gas = 6;
    required uint32 payload_length = 7;
}

/**
 * Response: Contains an input of a previous transaction.
 * @next KaspaTxRequest
 * @next Failure
 */
message KaspaTxAckPrevInput {
    required KaspaOutpoint previous_outpoint = 1;
    required uint64 sequence = 2;
}

/**
 * Response: Contains an output of a previous transaction.
 * @next KaspaTxRequest
 * @next Failure
 */
message KaspaTxAckPrevOutput {
    required uint64 amount = 1;
    required uint32 script_version = 2;
    required bytes script_public_key = 3;
}

/**
 * Response: transaction signature
 * @end
 */
message KaspaSignedTx {
    required bytes signature = 2;   // signature of the message
}
